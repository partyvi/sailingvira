# Pages CMS configuration (https://pagescms.org).
# Viktor has full access: stories in both languages, sections and site settings.
# Photos stay on Blogger: paste the photo URL (size s1600) into the story text, not an upload.

content:
  - name: stories_en
    label: Stories (English)
    type: collection
    path: content/en/projects
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    view:
      fields: [title, section, order]
      primary: title
      sort: [section, order]
    fields:
      - name: id
        label: Id (file name and URL, e.g. engine)
        type: string
        required: true
        description: Lowercase, no spaces. Use the same id for the English and Ukrainian story. Only used when creating a new story.
      - name: title
        label: Title
        type: string
        required: true
      - name: section
        label: Section
        type: string
        required: true
        description: "Section id: story, hull, rig, engine, electric, interior or voyages (see Sections)."
      - name: order
        label: Order inside the section
        type: number
      - name: description
        label: One-line description
        type: string
      - name: cover
        label: Cover photo URL
        type: string
        description: Blogger photo URL at size s1600, shown on the project card.
      - name: body
        label: Story
        type: code
        options:
          format: markdown
        description: >
          "## Heading" starts a chapter. Blank line between paragraphs. "- " is a list item.
          ![](photo url) is a photo; photos one after another form a gallery.
          "Diary: [28 May 2022](post url)" links back to the diary post.

  - name: stories_ua
    label: Історії (українською)
    type: collection
    path: content/ua/projects
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    view:
      fields: [title, section, order]
      primary: title
      sort: [section, order]
    fields:
      - name: id
        label: Id (file name and URL, e.g. engine)
        type: string
        required: true
        description: Lowercase, no spaces. Use the same id for the English and Ukrainian story. Only used when creating a new story.
      - name: title
        label: Title
        type: string
        required: true
      - name: section
        label: Section
        type: string
        required: true
        description: "Section id: story, hull, rig, engine, electric, interior or voyages (see Sections)."
      - name: order
        label: Order inside the section
        type: number
      - name: description
        label: One-line description
        type: string
      - name: cover
        label: Cover photo URL
        type: string
        description: Blogger photo URL at size s1600, shown on the project card.
      - name: body
        label: Story
        type: code
        options:
          format: markdown
        description: >
          "## Heading" starts a chapter. Blank line between paragraphs. "- " is a list item.
          ![](photo url) is a photo; photos one after another form a gallery.
          "Diary: [28 May 2022](post url)" links back to the diary post.

  - name: pages_en
    label: "Site pages (English)"
    type: collection
    path: content/en/pages
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: id, label: Id (file name), type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Address on the site (e.g. boat/likes/), type: string, required: true }
      - name: tab
        label: Tab it belongs to
        type: select
        options:
          values: [home, boat, projects, sailing, workshop, videos, about, contact]
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: description, label: One-line description, type: string }
      - { name: cover, label: Photo for sharing (URL), type: string }
      - { name: portrait, label: "Portrait next to the title (assets/viktor.webp or a photo URL)", type: string }
      - { name: updated, label: Last updated (shown at the bottom of the page), type: date }
      - name: body
        label: Page text
        type: code
        options:
          format: markdown
        description: >
          Same format as the stories, plus: "| a | b |" lines make a table, "Card: [Title](boat/likes/) | text" makes a link card,
          "Was/now: ![](old url) ![](new url) | caption" makes a was/now photo pair.

  - name: pages_ua
    label: "Сторінки сайту (українською)"
    type: collection
    path: content/ua/pages
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: id, label: Id (file name), type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Address on the site (e.g. boat/likes/), type: string, required: true }
      - name: tab
        label: Tab it belongs to
        type: select
        options:
          values: [home, boat, projects, sailing, workshop, videos, about, contact]
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: description, label: One-line description, type: string }
      - { name: cover, label: Photo for sharing (URL), type: string }
      - { name: portrait, label: "Portrait next to the title (assets/viktor.webp or a photo URL)", type: string }
      - { name: updated, label: Last updated (shown at the bottom of the page), type: date }
      - name: body
        label: Page text
        type: code
        options:
          format: markdown
        description: >
          Same format as the stories, plus: "| a | b |" lines make a table, "Card: [Title](boat/likes/) | text" makes a link card,
          "Was/now: ![](old url) ![](new url) | caption" makes a was/now photo pair.

  - name: sections
    label: Sections
    type: file
    path: content/sections.yml
    format: yaml
    list: true
    fields:
      - name: id
        label: Id (used in URLs and stories)
        type: string
        required: true
      - name: order
        label: Order
        type: number
      - name: tab
        label: Shown under tab
        type: select
        description: Projects (default) or Sailing.
        options:
          values: [projects, sailing]
      - name: title
        label: Title
        type: object
        fields:
          - { name: en, label: English, type: string }
          - { name: ua, label: Українською, type: string }

  - name: site
    label: Site settings
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - { name: name, label: Site name, type: string }
      - { name: base_url, label: Base URL, type: string }
      - name: noindex
        label: Hidden from search engines (noindex)
        type: boolean
        description: Keep on until the site goes public.
      - { name: blog_url, label: Blogger diary URL, type: string }
      - { name: diary_url, label: Boat diary tab link (later diary.sailingvira.com), type: string }
      - { name: youtube_url, label: YouTube channel link, type: string }
      - name: banner_home
        label: Home banner photo (16:7)
        type: string
        description: A path in the site (assets/banner-home.webp) or a full photo URL.
      - name: banner_strip
        label: Banner strip on other pages (5:1)
        type: string
        description: A path in the site (assets/banner-strip.webp) or a full photo URL.
      - name: tile_workshop
        label: Home page Workshop tile photo
        type: string
        description: A path in the site (assets/tile-workshop.webp) or a full photo URL. Empty = no photo.
      - name: tile_about
        label: Home page About me tile photo
        type: string
        description: A path in the site (assets/tile-about.webp) or a full photo URL. Empty = no photo.
      - name: home
        label: Home page
        type: object
        fields:
          - name: eyebrow
            label: Small line above the title
            type: object
            fields:
              - { name: en, label: English, type: string }
              - { name: ua, label: Українською, type: string }
          - name: title
            label: Title
            type: object
            fields:
              - { name: en, label: English, type: string }
              - { name: ua, label: Українською, type: string }
          - name: intro
            label: Intro
            type: object
            fields:
              - { name: en, label: English, type: text }
              - { name: ua, label: Українською, type: text }

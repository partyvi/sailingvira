<meta charset="utf-8">
<title>Vira Rebuild Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a logbook. Condensed signage type for names, serif for the story, mono for dates and day numbers. */
:root{
  --bg:#F2F5F6; --paper:#FFFFFF; --ink:#10222E; --muted:#56666F; --line:#D3DCE0;
  --accent:#0E6A87; --brass:#8C6A1C; --shade:rgba(16,34,46,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B151B; --paper:#11202A; --ink:#E3EBEE; --muted:#93A4AD; --line:#243540;
  --accent:#62B9D6; --brass:#D2AE5A; --shade:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B151B; --paper:#11202A; --ink:#E3EBEE; --muted:#93A4AD; --line:#243540;
  --accent:#62B9D6; --brass:#D2AE5A; --shade:rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
/* home */
.mast{display:grid;gap:10px;padding-block:24px 36px;border-bottom:1px solid var(--line)}
.mast .eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.mast h1{font-size:clamp(64px,13vw,148px);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.mast p{margin:0;max-width:62ch;font-size:19px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:8px}
.stats b{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink);display:block;line-height:1}
.group{padding-block:36px 8px}
.group>h2{font-size:34px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin-bottom:18px;display:flex;align-items:baseline;gap:14px}
.group>h2 .mono{text-transform:none;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shade)}
.card .ph{aspect-ratio:4/3;background:var(--line) center/cover no-repeat}
.card .tx{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.card h3{font-size:24px;font-weight:600}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.pill{justify-self:start;font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--accent);color:var(--accent)}
/* project page */
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top a{font-family:var(--f-mono);font-size:13px;text-decoration:none}
.phead{display:grid;gap:10px;padding-block:28px 8px;max-width:760px}
.phead .eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.phead h1{font-size:clamp(44px,8vw,80px);font-weight:700;text-transform:uppercase}
.phead p{margin:0;color:var(--muted);font-size:19px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);padding-top:30px;display:grid;gap:4px}
.toc a{font-family:var(--f-display);font-size:17px;text-decoration:none;color:var(--muted);line-height:1.25;padding:3px 0 3px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent)}
.story{min-width:0}
.intro p{font-size:19px}
.chap{padding-top:34px;scroll-margin-top:16px}
.chap h2{font-size:clamp(30px,4.4vw,40px);font-weight:600}
.log{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 4px}
.log span:first-child{color:var(--brass)}
.story p,.story ul{max-width:68ch}
.story p{margin:.75em 0}
.story ul{padding-left:1.2em}
.story li{margin:.2em 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:16px 0 4px}
.gal.n1{grid-template-columns:minmax(0,640px)}
.gal.n1 button{justify-self:start;background:none}
.gal.n2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:860px}
.gal button{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;background:var(--line);border-radius:4px;overflow:hidden}
.gal.n1 button{aspect-ratio:auto;min-height:120px}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal.n1 img{height:auto;width:auto;max-width:100%;max-height:480px;border-radius:4px}
.src{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
.src a{color:var(--muted);text-decoration:none}
.src a:hover{color:var(--accent)}
.pending{margin-top:28px;padding:18px 20px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);max-width:68ch}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.pnav a{text-decoration:none;display:grid;gap:2px}
.pnav a:last-child{text-align:right}
.pnav b{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--ink)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(6,12,16,.94);display:grid;grid-template-rows:1fr auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;object-fit:contain;place-self:center;min-height:0}
.lb .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;color:#C9D6DC;font-family:var(--f-mono);font-size:13px;padding-top:10px;flex-wrap:wrap}
.lb .bar a{color:#9FD3E6}
.lb button{background:none;border:1px solid #4A5C66;color:#E3EBEE;border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer}
.lb .ctl{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap" id="app"></div>
<div class="lb" id="lb" hidden>
  <img id="lbimg" alt="">
  <div class="bar"><span id="lbcap"></span><span class="ctl"><button id="lbprev" aria-label="Previous photo">←</button><button id="lbnext" aria-label="Next photo">→</button><button id="lbclose">Close</button></span></div>
</div>

<script>
const DATA=/*__DATA__*/null;
const app=document.getElementById('app');
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>{const[y,m,dd]=d.split('-');return `${+dd} ${MONTHS[m-1]} ${y}`};
const span=(a,b)=>{if(!a)return'';if(a===b)return fmt(a);const[ya,ma]=a.split('-'),[yb,mb]=b.split('-');
  if(ya===yb&&ma===mb)return `${+a.slice(8)}–${fmt(b)}`;if(ya===yb)return `${fmt(a).replace(' '+ya,'')} – ${fmt(b)}`;return `${fmt(a)} – ${fmt(b)}`};
const monthSpan=(a,b)=>{const f=d=>`${MONTHS[d.slice(5,7)-1]} ${d.slice(0,4)}`;return f(a)===f(b)?f(a):`${f(a)} – ${f(b)}`};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich=s=>esc(s).replace(/https?:\/\/[^\s<)]+[^\s<).,;]/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'').slice(0,48)}${u.length>56?'…':''}</a>`);
const order=DATA.structure.flatMap(g=>g.subs.map(s=>s[0]));
const packs={};
function loadPack(id){
  if(!packs[id])packs[id]=fetch('packs/'+id+'.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
  return packs[id];
}
function home(){
  const s=DATA.stats;
  let h=`<header class="mast"><span class="eyebrow">Irwin Citation 34 · 1978 · rebuild log</span><h1>Vira</h1>
  <p>From a neglected project boat on Lake Travis to sailing Galveston Bay. The day-by-day diary, regrouped by project and told as stories.</p>
  <div class="stats mono"><span><b>${s.posts}</b>diary posts</span><span><b>${s.days}</b>work days</span><span><b>${s.photos.toLocaleString('en-US')}</b>photos</span><span><b>${s.first.slice(0,4)}–${s.last.slice(0,4)}</b>Texas</span></div></header>`;
  for(const g of DATA.structure){
    h+=`<section class="group"><h2>${esc(g.title)} <span class="mono">${g.subs.length} projects</span></h2><div class="cards">`;
    for(const[id]of g.subs){const p=DATA.subs[id];
      const done=!!p.chapters;
      const when=done&&p.chapters.length?monthSpan(p.chapters.map(c=>c.from).filter(Boolean).sort()[0],p.chapters.map(c=>c.to).filter(Boolean).sort().pop()):'';
      h+=`<a class="card" href="#${id}"><div class="ph" style="${p.cover?`background-image:url(data:image/webp;base64,${p.cover})`:''}"></div><div class="tx">
      <h3>${esc(p.title)}</h3><p>${esc(p.blurb)}</p><span class="mono">${when?when+' · ':''}${p.n} photos</span>
      ${done?'':'<span class="pill">Story being written</span>'}</div></a>`}
    h+=`</div></section>`}
  h+=`<p class="mono" style="margin-top:40px">Source: <a href="https://irwin34.blogspot.com" target="_blank" rel="noopener">irwin34.blogspot.com</a>. Every chapter links to the original diary posts.</p>`;
  app.innerHTML=h;document.title='Vira Rebuild Log';
}
let gallery=[];
function project(id){
  const p=DATA.subs[id],i=order.indexOf(id),prev=order[i-1],next=order[i+1];
  gallery=[];
  let h=`<nav class="top"><a href="#">← All projects</a><span class="mono">${esc(p.group)}</span></nav>
  <header class="phead"><span class="eyebrow">${esc(p.group)}</span><h1>${esc(p.title)}</h1><p>${esc(p.blurb)}</p></header>`;
  if(!p.chapters){h+=`<div class="pending">This story is being written. ${p.n} photos are waiting for it.</div>`}
  else{
    let toc='',body='';
    if(p.intro&&p.intro.length)body+=`<div class="intro">${p.intro.map(b=>b.p?`<p>${rich(b.p)}</p>`:'').join('')}</div>`;
    p.chapters.forEach((c,ci)=>{
      toc+=`<a href="#${id}" data-chap="c${ci}">${esc(c.h)}</a>`;
      body+=`<section class="chap" id="c${ci}"><h2>${esc(c.h)}</h2><div class="log mono">`+
        (c.days?`<span>Day ${c.days[0]===c.days[1]?c.days[0]:c.days[0]+'–'+c.days[1]}</span>`:'<span>Story page</span>')+
        (c.from?`<span>${span(c.from,c.to)}</span>`:'')+`</div>`;
      for(const b of c.blocks){
        if(b.p)body+=`<p>${rich(b.p)}</p>`;
        else if(b.ul)body+=`<ul>${b.ul.map(x=>`<li>${rich(x)}</li>`).join('')}</ul>`;
        else if(b.g){
          const n=b.g.length;body+=`<div class="gal${n===1?' n1':n===2?' n2':''}">`;
          for(const[img,k]of b.g){gallery.push([img,k]);body+=`<button data-i="${gallery.length-1}" aria-label="Open photo"><img data-id="${img}" alt="Photo from the diary, ${fmt(DATA.sources[k].d)}"></button>`}
          body+=`</div><div class="src mono">`+[...new Set(b.g.map(x=>x[1]))].map(k=>{const s=DATA.sources[k];
            return `<a href="${s.u}" target="_blank" rel="noopener">${s.page?'Story page':'Diary'} · ${fmt(s.d)} ↗</a>`}).join('')+`</div>`}
      }
      body+=`</section>`});
    h+=`<div class="layout"><div class="story">${body}</div><aside class="toc">${toc}</aside></div>`;
  }
  h+=`<nav class="pnav">${prev?`<a href="#${prev}"><span class="mono">← Previous</span><b>${esc(DATA.subs[prev].title)}</b></a>`:'<span></span>'}${next?`<a href="#${next}"><span class="mono">Next →</span><b>${esc(DATA.subs[next].title)}</b></a>`:''}</nav>`;
  app.innerHTML=h;document.title=p.title+' · Vira';
  app.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.chap).scrollIntoView({behavior:'smooth'})}));
  if(p.chapters)loadPack(id).then(pk=>{if(location.hash.slice(1)!==id)return;
    app.querySelectorAll('img[data-id]').forEach(im=>{const b=pk[im.dataset.id];if(b)im.src='data:image/webp;base64,'+b})});
}
function route(){const id=location.hash.slice(1);if(DATA.subs[id])project(id);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
/* lightbox */
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbcap=document.getElementById('lbcap');let cur=0;
function show(i){cur=(i+gallery.length)%gallery.length;const[img,k]=gallery[cur],s=DATA.sources[k];
  const el=app.querySelector(`img[data-id="${img}"]`);lbimg.src=el&&el.src?el.src:'';
  lbcap.innerHTML=`${cur+1} / ${gallery.length} · <a href="${s.u}" target="_blank" rel="noopener">${s.page?'Story page':'Diary'} · ${fmt(s.d)} ↗</a>`;lb.hidden=false}
app.addEventListener('click',e=>{const b=e.target.closest('.gal button');if(b)show(+b.dataset.i)});
document.getElementById('lbclose').onclick=()=>lb.hidden=true;
document.getElementById('lbprev').onclick=()=>show(cur-1);
document.getElementById('lbnext').onclick=()=>show(cur+1);
lb.addEventListener('click',e=>{if(e.target===lb)lb.hidden=true});
addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
</script>
